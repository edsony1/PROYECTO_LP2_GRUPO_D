<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Tienda Ropa - Crear cuenta</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
	<link rel="stylesheet" th:href="@{/login.css}">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="d-flex flex-column min-vh-100">

	<div th:replace="~{fragments/nav :: nav}"></div>

	<div class="auth-wrapper flex-grow-1 d-flex align-items-center justify-content-center">

		<div class="login-card" style="max-width: 460px;">

			<div class="login-icon">
				<i class="fa-solid fa-user-plus"></i>
			</div>

			<h2>Crear cuenta</h2>
			<p class="subtitle">Regístrate para comprar en la tienda</p>

			<form th:action="@{/login/registro}" th:object="${filter}" method="post">

				<div class="row">
					<div class="col-md-6 mb-3">
						<label class="form-label">Nombres</label>
						<div class="input-group">
							<span class="input-group-text"><i class="fas fa-user"></i></span>
							<input type="text" class="form-control" th:field="*{nombres}" placeholder="Juan" required>
						</div>
					</div>

					<div class="col-md-6 mb-3">
						<label class="form-label">Apellidos</label>
						<div class="input-group">
							<span class="input-group-text"><i class="fas fa-user"></i></span>
							<input type="text" class="form-control" th:field="*{apellidos}" placeholder="Pérez" required>
						</div>
					</div>
				</div>

				<div class="mb-3">
					<label class="form-label">Correo</label>
					<div class="input-group">
						<span class="input-group-text"><i class="fas fa-envelope"></i></span>
						<input type="email" class="form-control" th:field="*{correo}" placeholder="correo@ejemplo.com" required>
					</div>
				</div>

				<div class="mb-3">
					<label class="form-label">Contraseña</label>
					<div class="input-group">
						<span class="input-group-text"><i class="fas fa-lock"></i></span>
						<input type="password" class="form-control" th:field="*{password}" placeholder="••••••••" required>
					</div>
				</div>

				<div class="mb-3">
					<label class="form-label">Fecha de nacimiento</label>
					<div class="input-group">
						<span class="input-group-text"><i class="fas fa-cake-candles"></i></span>
						<input type="date" class="form-control" th:field="*{fechaNacimiento}" required>
					</div>
				</div>

				<button type="submit" class="btn btn-dark w-100 mt-2">
					<i class="fas fa-user-plus"></i> Crear cuenta
				</button>

			</form>

			<p class="text-center mt-4 mb-0 small">
				¿Ya tienes cuenta?
				<a th:href="@{/login}" class="link-dark fw-semibold">Inicia sesión</a>
			</p>

		</div>

	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>

	<th:block th:utext="${alert}"></th:block>

</body>
</html>
