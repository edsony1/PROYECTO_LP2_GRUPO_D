<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Tienda Ropa - Dashboard</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
	<link rel="stylesheet" th:href="@{/login.css}">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

	<div th:replace="~{fragments/nav :: nav}"></div>

	<div class="container mt-4 flex-grow-1">

		<h2 class="mb-1">
			<i class="fa-solid fa-gauge"></i> Panel de administración
		</h2>
		<p class="text-muted mb-4">
			Bienvenido, <span th:text="${session.fullName}"></span>
		</p>

		<div class="row g-4">

			<div class="col-md-4">
				<div class="card shadow-sm h-100">
					<div class="card-body">
						<i class="fas fa-shirt fa-2x text-dark mb-2"></i>
						<h5 class="card-title">Productos</h5>
						<p class="card-text text-muted small">
							Gestiona el catálogo de productos de la tienda.
						</p>
						<a th:href="@{/producto}" class="btn btn-dark btn-sm">Administrar</a>
					</div>
				</div>
			</div>

			<div class="col-md-4">
				<div class="card shadow-sm h-100">
					<div class="card-body">
						<i class="fas fa-store fa-2x text-dark mb-2"></i>
						<h5 class="card-title">Tienda</h5>
						<p class="card-text text-muted small">
							Visualiza la tienda como la ven los clientes.
						</p>
						<a th:href="@{/inicio}" class="btn btn-outline-dark btn-sm">Ver tienda</a>
					</div>
				</div>
			</div>

		</div>

	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>

	<th:block th:utext="${alert}"></th:block>

</body>
</html>
