<div th:fragment="nav" xmlns:th="http://www.thymeleaf.org">

	<nav class="tienda-nav navbar navbar-expand-lg">
		<div class="container py-2">

			<!-- Botón hamburguesa: solo visible cuando hay sesión activa -->
			<button th:if="${session.idRol == 1}" class="btn-menu" onclick="toggleSidebar()" aria-label="Abrir menú">
				<i class="fa-solid fa-bars"></i>
			</button>

			<a class="navbar-brand ms-3" th:href="@{/inicio}">
				<span class="navbar-brand-icon"><i class="fa-solid fa-shirt"></i></span>
				EVESTIS
			</a>

			<div class="d-flex align-items-center ms-auto gap-2">

				<!-- Sin sesión: botón de login -->
				<a th:if="${session.idUsuario == null}"
				   th:href="@{/login}"
				   class="btn btn-acento btn-sm">
					<i class="fas fa-sign-in-alt"></i> Iniciar sesión
				</a>

				<!-- Con sesión: admin solo muestra cerrar sesión; cliente muestra carrito + dropdown -->
				<div th:if="${session.idUsuario != null}" class="d-flex align-items-center gap-2">

					<!-- CLIENTE: carrito con badge -->
					<a th:if="${session.idRol == 2}" th:href="@{/carrito}"
					   class="btn btn-nav-link btn-sm position-relative">
						<i class="fas fa-cart-shopping"></i> Carrito
						<span th:if="${totalItemsCarrito > 0}"
							  th:text="${totalItemsCarrito}"
							  class="nav-cart-badge"></span>
					</a>

					<span class="nav-divider d-none d-lg-block"></span>

					<!-- CLIENTE: dropdown con avatar -->
					<div th:if="${session.idRol == 2}" class="dropdown nav-user-dropdown">
						<a href="#" class="nav-user-toggle" data-bs-toggle="dropdown" aria-expanded="false">
							<span class="nav-user-avatar" th:text="${#strings.substring(session.fullName, 0, 1)}"></span>
							<span class="nav-user-name" th:text="${session.fullName}"></span>
							<i class="fas fa-chevron-down nav-user-caret"></i>
						</a>
						<ul class="dropdown-menu dropdown-menu-end nav-user-menu">
						    <li>
						        <a class="dropdown-item" th:href="@{/mis-pedidos}">
						            <i class="fas fa-receipt"></i> Mis pedidos
						        </a>
						    </li>
						    <li>
						        <a class="dropdown-item" th:href="@{/usuario/perfil}">
						            <i class="fas fa-circle-user"></i> Mi perfil
						        </a>
						    </li>
						    <li><hr class="dropdown-divider"></li>
						    <li>
						        <a class="dropdown-item dropdown-item-danger" th:href="@{/login/cerrar-sesion}">
						            <i class="fas fa-sign-out-alt"></i> Cerrar sesión
						        </a>
						    </li>
						</ul>
					</div>

					<!-- ADMIN: solo botón cerrar sesión (la navegación va en el sidebar) -->
					<div th:if="${session.idRol == 1}" class="d-flex align-items-center gap-2">
						<span class="nav-user" style="color:#f7f3ec; font-size:0.9rem;">
							<i class="fas fa-circle-user"></i>
							<span th:text="${session.fullName}"></span>
						</span>
						<a th:href="@{/login/cerrar-sesion}" class="btn btn-nav-link btn-sm" title="Cerrar sesión">
							<i class="fas fa-sign-out-alt"></i>
						</a>
					</div>

				</div>
			</div>
		</div>
	</nav>

	<!-- SIDEBAR (solo cuando hay sesión) -->
	<div th:if="${session.idUsuario != null}">

		<div id="sidebar" class="sidebar">
			<div class="sidebar-header">
				<h5>EVESTIS</h5>
				<button class="btn-close-menu" onclick="toggleSidebar()" aria-label="Cerrar menú">
					<i class="fa-solid fa-xmark"></i>
				</button>
			</div>

			<!-- ADMIN -->
			<div th:if="${session.idRol == 1}">
				<div class="sidebar-section">Administración</div>
				<a th:href="@{/dashboard}" class="sidebar-link">
					<i class="fas fa-gauge"></i> Dashboard
				</a>
				<a th:href="@{/producto}" class="sidebar-link">
					<i class="fas fa-tags"></i> Productos
				</a>
				<a th:href="@{/proveedor/listado}" class="sidebar-link">
					<i class="fas fa-truck"></i> Proveedores
				</a>
				<a th:href="@{/usuario/listado}" class="sidebar-link">
					<i class="fas fa-users"></i> Usuarios
				</a>
			</div>

			
		</div>

		<!-- Overlay -->
		<div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

	</div>

	<script>
		function toggleSidebar() {
			document.getElementById('sidebar').classList.toggle('active');
			document.getElementById('sidebar-overlay').classList.toggle('active');
		}
	</script>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</div>
