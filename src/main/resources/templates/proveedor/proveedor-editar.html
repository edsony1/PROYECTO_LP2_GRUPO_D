<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Tienda Ropa - Editar Proveedor</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
	<link rel="stylesheet" th:href="@{/login.css}">
	<link rel="stylesheet" th:href="@{/admin.css}">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

	<div th:replace="~{fragments/nav :: nav}"></div>

	<div class="container mt-4 mb-5 flex-grow-1" style="max-width: 640px;">

		<!-- Header -->
		<div class="form-page-header">
			<div class="header-icon">
				<i class="fas fa-pen-to-square"></i>
			</div>
			<div>
				<h2>Editar proveedor</h2>
				<p>Modifica los datos del proveedor</p>
				<span class="id-badge">
					<i class="fas fa-hashtag me-1"></i>ID: <span th:text="${proveedor.idProveedor}"></span>
				</span>
			</div>
		</div>

		<!-- Card -->
		<div class="form-card">
			<form th:action="@{/proveedor/guardar}" th:object="${proveedor}" method="post">
				<input type="hidden" th:field="*{idProveedor}">

				<!-- Datos de la empresa -->
				<div class="form-section">
					<div class="section-label"><i class="fas fa-building"></i> Datos de la empresa</div>

					<div class="mb-0">
						<label class="form-label">Razón social <span class="text-danger">*</span></label>
						<div class="input-icon-wrap">
							<i class="input-icon fas fa-building"></i>
							<input type="text" class="form-control" th:field="*{razonSocial}"
								   placeholder="Ej: Saga Falabella S.A." required>
						</div>
					</div>
				</div>

				<!-- Contacto -->
				<div class="form-section">
					<div class="section-label"><i class="fas fa-address-book"></i> Información de contacto</div>

					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Celular <span class="text-danger">*</span></label>
							<div class="input-icon-wrap">
								<i class="input-icon fas fa-phone"></i>
								<input type="text" class="form-control" th:field="*{celular}"
									   placeholder="Ej: 999888777" required>
							</div>
						</div>
						<div class="col-md-6">
							<label class="form-label">Email <span class="text-danger">*</span></label>
							<div class="input-icon-wrap">
								<i class="input-icon fas fa-envelope"></i>
								<input type="email" class="form-control" th:field="*{email}"
									   placeholder="ventas@empresa.com" required>
							</div>
						</div>
					</div>
				</div>

				<!-- Footer -->
				<div class="form-footer">
					<button type="submit" class="btn-guardar">
						<i class="fas fa-floppy-disk me-2"></i>Guardar cambios
					</button>
					<a th:href="@{/proveedor/listado}" class="btn-cancelar">
						<i class="fas fa-arrow-left"></i> Cancelar
					</a>
				</div>

			</form>
		</div>

	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>
	<th:block th:utext="${alert}"></th:block>

</body>
</html>
