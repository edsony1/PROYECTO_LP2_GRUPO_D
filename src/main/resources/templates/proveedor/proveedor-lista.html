<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Tienda Ropa - Proveedores</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
	<link rel="stylesheet" th:href="@{/login.css}">
	<link rel="stylesheet" th:href="@{/admin.css}">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

	<div th:replace="~{fragments/nav :: nav}"></div>

	<div class="container mt-4 mb-5 flex-grow-1">

		<!-- Header -->
		<div class="page-header">
			<div class="page-header-left">
				<div class="header-icon">
					<i class="fas fa-truck"></i>
				</div>
				<div>
					<h2>Proveedores</h2>
					<p>Gestión de proveedores del catálogo</p>
				</div>
			</div>
			<a th:href="@{/proveedor/nuevo}" class="btn-nuevo">
				<i class="fas fa-plus"></i> Nuevo proveedor
			</a>
		</div>

		<!-- Tabla -->
		<div class="table-card">
			<table class="table" th:if="${!#lists.isEmpty(lstProveedores)}">
				<thead>
					<tr>
						<th>#</th>
						<th>Razón social</th>
						<th>Celular</th>
						<th>Email</th>
						<th>Estado</th>
						<th class="text-end">Acciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="prov : ${lstProveedores}">
						<td>
							<span class="text-muted" style="font-size:0.82rem;" th:text="${prov.idProveedor}"></span>
						</td>
						<td>
							<div class="d-flex align-items-center gap-2">
								<div class="proveedor-avatar">
									<i class="fas fa-building"></i>
								</div>
								<span th:text="${prov.razonSocial}"></span>
							</div>
						</td>
						<td>
							<i class="fas fa-phone text-muted me-1" style="font-size:0.8rem;"></i>
							<span th:text="${prov.celular}"></span>
						</td>
						<td>
							<i class="fas fa-envelope text-muted me-1" style="font-size:0.8rem;"></i>
							<span th:text="${prov.email}"></span>
						</td>
						<td>
							<span th:if="${prov.estado}" class="badge-activo">Activo</span>
							<span th:unless="${prov.estado}" class="badge-inactivo">Inactivo</span>
						</td>
						<td class="text-end">
							<div class="d-flex gap-1 justify-content-end">
								<a th:href="@{'/proveedor/edicion/' + ${prov.idProveedor}}"
								   class="btn-accion btn-editar" title="Editar">
									<i class="fas fa-pen"></i>
								</a>
								<form th:if="${prov.estado}"
									  th:action="@{'/proveedor/cambiar-estado/' + ${prov.idProveedor}}"
									  method="post" style="display:inline;">
									<button type="submit" class="btn-accion btn-desactivar" title="Desactivar">
										<i class="fas fa-ban"></i>
									</button>
								</form>
								<form th:unless="${prov.estado}"
									  th:action="@{'/proveedor/cambiar-estado/' + ${prov.idProveedor}}"
									  method="post" style="display:inline;">
									<button type="submit" class="btn-accion btn-activar" title="Activar">
										<i class="fas fa-check"></i>
									</button>
								</form>
							</div>
						</td>
					</tr>
				</tbody>
			</table>

			<div class="empty-state" th:if="${#lists.isEmpty(lstProveedores)}">
				<i class="fas fa-truck-ramp-box"></i>
				<p class="mb-0">No hay proveedores registrados aún.</p>
			</div>
		</div>

	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>
	<th:block th:utext="${toast}"></th:block>

</body>
</html>
