<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Tienda Ropa - Inicio</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
	<link rel="stylesheet" th:href="@{/login.css}">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

	<div th:replace="~{fragments/nav :: nav}"></div>

	<div class="container mt-4 flex-grow-1">

		<h2 class="mb-4">Nuestros productos</h2>

		<div class="mb-4 d-flex flex-wrap gap-2">
			<a th:href="@{/inicio}"
			   th:class="${idCategoria == null} ? 'btn btn-sm btn-dark' : 'btn btn-sm btn-outline-dark'">
				Todas
			</a>
			<a th:each="categoria : ${categorias}"
			   th:href="@{/inicio(idCategoria=${categoria.idCategoria})}"
			   th:text="${categoria.descripcion}"
			   th:class="${idCategoria != null and idCategoria == categoria.idCategoria} ? 'btn btn-sm btn-dark' : 'btn btn-sm btn-outline-dark'">
			</a>
		</div>

		<div class="row" th:if="${#lists.isEmpty(productos)}">
			<div class="col-12">
				<p class="text-muted">No hay productos disponibles por el momento.</p>
			</div>
		</div>

		<div class="row g-4">
			<div class="col-md-3" th:each="producto : ${productos}">
				<div class="card h-100 shadow-sm">
					<img th:if="${producto.imagen}" th:src="@{'/img/' + ${producto.imagen}}"
						class="card-img-top" alt="Ponganle imagen p"
						style="height: 220px; object-fit: cover;">
					<div class="card-body d-flex flex-column">
						<span class="badge bg-secondary mb-2" th:text="${producto.categoria.descripcion}"></span>
						<h5 class="card-title" th:text="${producto.nombre}"></h5>
						<p class="card-text text-muted small" th:text="${producto.descripcion}"></p>
						<div class="mt-auto">
							<p class="fw-bold fs-5 mb-1" th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1, 2)}"></p>
							<p class="small text-muted mb-2" th:text="'Stock: ' + ${producto.stock}"></p>
							<button type="button" class="btn btn-dark w-100">
								<i class="fas fa-cart-plus"></i> Agregar al carrito
							</button>
						</div>
					</div>
				</div>
			</div>
		</div>

	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>

	<th:block th:utext="${alert}"></th:block>
</body>
</html>
