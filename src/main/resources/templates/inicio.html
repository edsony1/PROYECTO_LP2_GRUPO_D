<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Tienda Ropa - Inicio</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
	<link rel="stylesheet" th:href="@{/login.css}">
	<link rel="stylesheet" th:href="@{/tienda.css}">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="d-flex flex-column min-vh-100" style="background:#ffffff;">

	<div th:replace="~{fragments/nav :: nav}"></div>

	<div class="container mt-4 mb-5 flex-grow-1">

		<!-- Hero de bienvenida -->
		<div class="tienda-hero">
			<p class="tienda-hero-eyebrow">Colección actual</p>
			<h1>Viste tu estilo, a tu manera</h1>
			<p>Prendas seleccionadas con cuidado para tu día a día. Encuentra tu talla, tu color y tu próxima
				prenda favorita.</p>
		</div>

		<!-- Filtros por categoría -->
		<div class="tienda-filtros">
			<a th:href="@{/inicio}"
			   th:class="${idCategoria == null} ? 'filtro-pill activo' : 'filtro-pill'">
				<i class="fas fa-border-all"></i> Todas
			</a>
			<a th:each="categoria : ${categorias}"
			   th:href="@{/inicio(idCategoria=${categoria.idCategoria})}"
			   th:text="${categoria.descripcion}"
			   th:class="${idCategoria != null and idCategoria == categoria.idCategoria} ? 'filtro-pill activo' : 'filtro-pill'">
			</a>
		</div>

		<!-- Estado vacío -->
		<div class="tienda-empty-state" th:if="${#lists.isEmpty(productos)}">
			<i class="fas fa-shirt"></i>
			<p>No hay productos disponibles por el momento.</p>
		</div>

		<!-- Grilla de productos -->
		<div class="row g-4">
			<div class="col-lg-3 col-md-4 col-sm-6" th:each="producto : ${productos}">
				<div class="producto-card">

					<div class="producto-img-wrap">
						<img th:if="${producto.imagen}" th:src="@{'/img/' + ${producto.imagen}}"
							 th:alt="${producto.nombre}">
						<div class="producto-img-placeholder" th:unless="${producto.imagen}">
							<i class="fas fa-shirt"></i>
						</div>

						<span class="producto-categoria-tag"
							  th:text="${producto.categoria.descripcion}"></span>
					</div>

					<div class="producto-body">
						<h3 class="producto-nombre" th:text="${producto.nombre}"></h3>
						<p class="producto-desc" th:text="${producto.descripcion}"></p>
						<p class="producto-proveedor">
							<i class="fas fa-truck"></i>
							<span th:text="${producto.proveedor.razonSocial}"></span>
						</p>

						<div class="producto-footer">
							<div class="producto-precio-row">
								<span class="producto-precio">
									<sup>S/</sup><span th:text="${#numbers.formatDecimal(producto.precio, 1, 2)}"></span>
								</span>
								<span th:class="${producto.stock != null and producto.stock le 5 and producto.stock > 0} ? 'producto-stock-info low' : 'producto-stock-info'"
									  th:text="${producto.stock != null and producto.stock > 0} ? ('Quedan ' + ${producto.stock}) : ''">
								</span>
							</div>

							<form th:action="@{/carrito/agregar}" method="post">
								<input type="hidden" name="idProd" th:value="${producto.idProd}">
								<input type="hidden" name="cantidad" value="1">
								<button type="submit" class="btn-agregar-carrito"
										th:disabled="${producto.stock == null or producto.stock == 0}">
									<i class="fas fa-cart-plus"></i>
									<span th:if="${producto.stock != null and producto.stock > 0}">Agregar al carrito</span>
									<span th:unless="${producto.stock != null and producto.stock > 0}">Sin stock</span>
								</button>
							</form>
						</div>
					</div>

				</div>
			</div>
		</div>

	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>

	<th:block th:utext="${alert}"></th:block>
</body>

</html>
