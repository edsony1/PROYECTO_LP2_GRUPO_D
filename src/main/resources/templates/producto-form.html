<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Tienda Ropa - Producto</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
	<link rel="stylesheet" th:href="@{/login.css}">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

	<div th:replace="~{fragments/nav :: nav}"></div>

	<div class="container mt-4 flex-grow-1">

		<h2 class="mb-4">
			<i class="fa-solid fa-shirt"></i>
			<span th:if="${producto.idProd == null}">Nuevo producto</span>
			<span th:unless="${producto.idProd == null}">Editar producto</span>
		</h2>

		<div class="card shadow-sm" style="max-width: 600px;">
			<div class="card-body">

				<form th:action="@{/producto/guardar}" th:object="${producto}" method="post">

					<input type="hidden" th:field="*{idProd}">

					<div class="mb-3">
						<label class="form-label">Nombre</label>
						<input type="text" class="form-control" th:field="*{nombre}" required>
					</div>

					<div class="mb-3">
						<label class="form-label">Descripción</label>
						<textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
					</div>

					<div class="row">
						<div class="col-md-6 mb-3">
							<label class="form-label">Precio</label>
							<input type="number" step="0.01" min="0" class="form-control" th:field="*{precio}" required>
						</div>

						<div class="col-md-6 mb-3">
							<label class="form-label">Stock</label>
							<input type="number" min="0" class="form-control" th:field="*{stock}" required>
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label">Categoría</label>
						<select class="form-select" name="idCategoria" required>
							<option value="">Seleccione una categoría</option>
							<option th:each="categoria : ${categorias}"
									th:value="${categoria.idCategoria}"
									th:text="${categoria.descripcion}"
									th:selected="${producto.categoria != null and producto.categoria.idCategoria == categoria.idCategoria}"></option>
						</select>
					</div>

					<div class="mb-3">
						<label class="form-label">Imagen (nombre de archivo)</label>
						<input type="text" class="form-control" th:field="*{imagen}" placeholder="producto.jpg">
					</div>

					<div class="d-flex gap-2 mt-4">
						<button type="submit" class="btn btn-dark">
							<i class="fas fa-floppy-disk"></i> Guardar
						</button>
						<a th:href="@{/producto}" class="btn btn-outline-secondary">
							Cancelar
						</a>
					</div>

				</form>

			</div>
		</div>

	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>

	<th:block th:utext="${alert}"></th:block>

</body>
</html>
