<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Tienda Ropa - Producto</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
	<link rel="stylesheet" th:href="@{/login.css}">
	<link rel="stylesheet" th:href="@{/admin.css}">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

	<div th:replace="~{fragments/nav :: nav}"></div>

	<div class="container mt-4 mb-5 flex-grow-1" style="max-width: 700px;">

		<!-- Header -->
		<div class="form-page-header">
			<div class="header-icon">
				<i class="fa-solid fa-shirt"></i>
			</div>
			<div>
				<h2 th:if="${producto.idProd == null}">Nuevo producto</h2>
				<h2 th:unless="${producto.idProd == null}">Editar producto</h2>
				<p th:if="${producto.idProd == null}">Completa los datos para registrar un nuevo producto en el catálogo</p>
				<p th:unless="${producto.idProd == null}">Modifica los campos que necesites actualizar</p>
			</div>
		</div>

		<!-- Card del formulario -->
		<div class="form-card">
			<form th:action="@{/producto/guardar}" th:object="${producto}" method="post">
				<input type="hidden" th:field="*{idProd}">

				<!-- Sección: Información básica -->
				<div class="form-section">
					<div class="section-label"><i class="fas fa-info-circle"></i> Información básica</div>

					<div class="mb-3">
						<label class="form-label">Nombre <span class="text-danger">*</span></label>
						<div class="input-icon-wrap">
							<i class="input-icon fas fa-tag"></i>
							<input type="text" class="form-control" th:field="*{nombre}"
								   placeholder="Ej: Polo Básico Negro" required>
						</div>
					</div>

					<div class="mb-0">
						<label class="form-label">Descripción</label>
						<textarea class="form-control" th:field="*{descripcion}"
								  rows="3" placeholder="Describe brevemente el producto..."></textarea>
					</div>
				</div>

				<!-- Sección: Precio y stock -->
				<div class="form-section">
					<div class="section-label"><i class="fas fa-chart-bar"></i> Precio y stock</div>

					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Precio <span class="text-danger">*</span></label>
							<div class="price-input-wrap">
								<span class="currency">S/</span>
								<input type="number" step="0.01" min="0.01" class="form-control"
									   th:field="*{precio}" placeholder="0.00" required>
							</div>
						</div>
						<div class="col-md-6">
							<label class="form-label">Stock <span class="text-danger">*</span></label>
							<div class="input-icon-wrap">
								<i class="input-icon fas fa-boxes-stacked"></i>
								<input type="number" min="0" class="form-control"
									   th:field="*{stock}" placeholder="0" required>
							</div>
						</div>
					</div>
				</div>

				<!-- Sección: Clasificación -->
				<div class="form-section">
					<div class="section-label"><i class="fas fa-layer-group"></i> Clasificación</div>

					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Categoría <span class="text-danger">*</span></label>
							<div class="input-icon-wrap">
								<i class="input-icon fas fa-folder"></i>
								<select class="form-select" name="idCategoria" required>
									<option value="">Selecciona...</option>
									<option th:each="categoria : ${categorias}"
											th:value="${categoria.idCategoria}"
											th:text="${categoria.descripcion}"
											th:selected="${producto.categoria != null and producto.categoria.idCategoria == categoria.idCategoria}">
									</option>
								</select>
							</div>
						</div>
						<div class="col-md-6">
							<label class="form-label">Proveedor <span class="text-danger">*</span></label>
							<div class="input-icon-wrap">
								<i class="input-icon fas fa-truck"></i>
								<select class="form-select" name="idProveedor" required>
									<option value="">Selecciona...</option>
									<option th:each="prov : ${proveedores}"
											th:value="${prov.idProveedor}"
											th:text="${prov.razonSocial}"
											th:selected="${producto.proveedor != null and producto.proveedor.idProveedor == prov.idProveedor}">
									</option>
								</select>
							</div>
						</div>
					</div>
				</div>

				<!-- Sección: Imagen -->
				<div class="form-section">
					<div class="section-label"><i class="fas fa-image"></i> Imagen</div>

					<div class="mb-0">
						<label class="form-label">Nombre de archivo <span class="text-danger">*</span></label>
						<div class="input-icon-wrap">
							<i class="input-icon fas fa-file-image"></i>
							<input type="text" class="form-control" th:field="*{imagen}"
								   placeholder="Ej: polo_negro.jpg" required>
						</div>
						<div class="form-text text-muted" style="font-size:0.78rem;">
							El archivo debe estar en <code>static/img/</code>
						</div>
					</div>
				</div>

				<!-- Footer con botones -->
				<div class="form-footer">
					<button type="submit" class="btn-guardar">
						<i class="fas fa-floppy-disk me-2"></i>Guardar producto
					</button>
					<a th:href="@{/producto}" class="btn-cancelar">
						<i class="fas fa-arrow-left"></i> Cancelar
					</a>
				</div>

			</form>
		</div>

	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>
	<th:block th:utext="${alert}"></th:block>

</body>
</html>
