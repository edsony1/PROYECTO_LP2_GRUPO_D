<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Tienda Ropa - Iniciar sesión</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="stylesheet" th:href="@{/login.css}">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="d-flex flex-column min-vh-100">

	<div th:replace="~{fragments/nav :: nav}"></div>

	<div class="auth-wrapper flex-grow-1 d-flex align-items-center justify-content-center">

		<div class="login-card">

			<div class="login-icon">
				<i class="fa-solid fa-shirt"></i>
			</div>

			<h2>Iniciar sesión</h2>
			<p class="subtitle">Ingresa tus credenciales para continuar</p>

			<form th:action="@{/login/iniciar-sesion}" th:object="${filter}" method="get">

				<div class="mb-3">
					<label class="form-label">Correo</label>
					<div class="input-group">
						<span class="input-group-text"><i class="fas fa-envelope"></i></span>
						<input type="email" class="form-control" th:field="*{correo}" placeholder="correo@ejemplo.com" required>
					</div>
				</div>

				<div class="mb-3">
					<label class="form-label">Contraseña</label>
					<div class="input-group">
						<span class="input-group-text"><i class="fas fa-lock"></i></span>
						<input type="password" class="form-control" th:field="*{password}" placeholder="••••••••" required>
					</div>
				</div>

				<button type="submit" class="btn btn-dark w-100 mt-2">
					<i class="fas fa-sign-in-alt"></i> Ingresar
				</button>

			</form>

			<p class="text-center mt-4 mb-0 small">
				¿Aún no tienes cuenta?
				<a th:href="@{/login/registro}" class="link-dark fw-semibold">Regístrate</a>
			</p>

		</div>

	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>

	<th:block th:utext="${alert}"></th:block>

</body>
</html>
