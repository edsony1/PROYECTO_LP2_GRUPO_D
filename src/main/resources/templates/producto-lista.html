<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Tienda Ropa - Productos</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
	<link rel="stylesheet" th:href="@{/login.css}">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

	<div th:replace="~{fragments/nav :: nav}"></div>

	<div class="container mt-4 flex-grow-1">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2 class="mb-0">
				<i class="fa-solid fa-shirt"></i> Productos
			</h2>
			<a th:href="@{/producto/nuevo}" class="btn btn-dark">
				<i class="fas fa-plus"></i> Nuevo producto
			</a>
		</div>

		<div class="table-responsive">
			<table class="table table-hover align-middle bg-white shadow-sm">
				<thead class="table-dark">
					<tr>
						<th>Código</th>
						<th>Nombre</th>
						<th>Categoría</th>
						<th>Precio</th>
						<th>Stock</th>
						<th>Estado</th>
						<th class="text-end">Acciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="producto : ${productos}">
						<td th:text="${producto.idProd}"></td>
						<td th:text="${producto.nombre}"></td>
						<td th:text="${producto.categoria.descripcion}"></td>
						<td th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1, 2)}"></td>
						<td th:text="${producto.stock}"></td>
						<td>
							<span th:if="${producto.estado}" class="badge bg-success">Activo</span>
							<span th:unless="${producto.estado}" class="badge bg-secondary">Inactivo</span>
						</td>
						<td class="text-end">
							<a th:href="@{'/producto/editar/' + ${producto.idProd}}" class="btn btn-outline-dark btn-sm">
								<i class="fas fa-pen"></i>
							</a>
							<a th:if="${producto.estado}"
							   th:href="@{'/producto/desactivar/' + ${producto.idProd}}"
							   class="btn btn-outline-danger btn-sm">
								<i class="fas fa-ban"></i>
							</a>
							<a th:unless="${producto.estado}"
							   th:href="@{'/producto/activar/' + ${producto.idProd}}"
							   class="btn btn-outline-success btn-sm">
								<i class="fas fa-check"></i>
							</a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<p th:if="${#lists.isEmpty(productos)}" class="text-muted">
			No hay productos registrados.
		</p>

	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>

	<th:block th:utext="${alert}"></th:block>

</body>
</html>
