<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Tienda Ropa - Productos</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
	<link rel="stylesheet" th:href="@{/login.css}">
	<link rel="stylesheet" th:href="@{/admin.css}">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

	<div th:replace="~{fragments/nav :: nav}"></div>

	<div class="container mt-4 mb-5 flex-grow-1">

		<!-- Header -->
		<div class="page-header">
			<div class="page-header-left">
				<div class="header-icon">
					<i class="fas fa-shirt"></i>
				</div>
				<div>
					<h2>Productos</h2>
					<p>Gestión del catálogo de productos</p>
				</div>
			</div>
			<a th:href="@{/producto/nuevo}" class="btn-nuevo">
				<i class="fas fa-plus"></i> Nuevo producto
			</a>
		</div>

		<!-- Buscador -->
		<form th:action="@{/producto}" method="get" class="row mb-3 g-2 align-items-center">
			<div class="col-md-4">
				<input type="text"
					   name="nombre"
					   class="form-control"
					   placeholder="Buscar producto..."
					   th:value="${nombre}">
			</div>
			<div class="col-auto">
				<button type="submit" class="btn-nuevo">
					<i class="fas fa-search"></i> Buscar
				</button>
			</div>
		</form>

		<!-- Tabla -->
		<div class="table-card">
			<table class="table" th:if="${!#lists.isEmpty(productos)}">
				<thead>
					<tr>
						<th>Código</th>
						<th>Nombre</th>
						<th>Categoría</th>
						<th>Precio</th>
						<th>Stock</th>
						<th>Estado</th>
						<th class="text-end">Acciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="producto : ${productos}">
						<td>
							<span class="text-muted" style="font-size:0.82rem;" th:text="${producto.idProd}"></span>
						</td>
						<td>
							<div class="d-flex align-items-center gap-2">
								<div class="row-avatar">
									<i class="fas fa-shirt"></i>
								</div>
								<span th:text="${producto.nombre}"></span>
							</div>
						</td>
						<td th:text="${producto.categoria.descripcion}"></td>
						<td th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1, 2)}"></td>
						<td th:text="${producto.stock}"></td>
						<td>
							<span th:if="${producto.estado}" class="badge-activo">Activo</span>
							<span th:unless="${producto.estado}" class="badge-inactivo">Inactivo</span>
						</td>
						<td class="text-end">
							<div class="d-flex gap-1 justify-content-end">
								<a th:href="@{'/producto/editar/' + ${producto.idProd}}"
								   class="btn-accion btn-editar" title="Editar">
									<i class="fas fa-pen"></i>
								</a>
								<a th:if="${producto.estado}"
								   th:href="@{'/producto/desactivar/' + ${producto.idProd}}"
								   class="btn-accion btn-desactivar" title="Desactivar">
									<i class="fas fa-ban"></i>
								</a>
								<a th:unless="${producto.estado}"
								   th:href="@{'/producto/activar/' + ${producto.idProd}}"
								   class="btn-accion btn-activar" title="Activar">
									<i class="fas fa-check"></i>
								</a>
							</div>
						</td>
					</tr>
				</tbody>
			</table>

			<div class="empty-state" th:if="${#lists.isEmpty(productos)}">
				<i class="fas fa-shirt"></i>
				<p class="mb-0">No hay productos registrados.</p>
			</div>
		</div>

	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>

	<th:block th:utext="${alert}"></th:block>

</body>
</html>
