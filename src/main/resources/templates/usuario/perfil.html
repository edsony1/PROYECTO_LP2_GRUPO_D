<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Tienda Ropa - Mi Perfil</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
	<link rel="stylesheet" th:href="@{/login.css}">
	<link rel="stylesheet" th:href="@{/admin.css}">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

	<div th:replace="~{fragments/nav :: nav}"></div>

	<div class="container mt-4 mb-5 flex-grow-1" style="max-width: 600px;">

		<div class="form-page-header">
			<div class="header-icon">
				<i class="fas fa-circle-user"></i>
			</div>
			<div>
				<h2>Mi perfil</h2>
				<p>Actualiza tus datos personales</p>
			</div>
		</div>

		<div class="form-card">
			<form th:action="@{/usuario/perfil/guardar}" method="post">

				<!-- Datos personales -->
				<div class="form-section">
					<div class="section-label"><i class="fas fa-info-circle"></i> Datos personales</div>

					<div class="mb-3">
						<label class="form-label">Nombres <span class="text-danger">*</span></label>
						<div class="input-icon-wrap">
							<i class="input-icon fas fa-user"></i>
							<input type="text" class="form-control" name="nombres"
								   th:value="${usuario.nombres}" required>
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label">Apellidos <span class="text-danger">*</span></label>
						<div class="input-icon-wrap">
							<i class="input-icon fas fa-user"></i>
							<input type="text" class="form-control" name="apellidos"
								   th:value="${usuario.apellidos}" required>
						</div>
					</div>

					<div class="mb-0">
						<label class="form-label">Correo electrónico <span class="text-danger">*</span></label>
						<div class="input-icon-wrap">
							<i class="input-icon fas fa-envelope"></i>
							<input type="email" class="form-control" name="correo"
								   th:value="${usuario.correo}" required>
						</div>
					</div>
				</div>

				<!-- Fecha de nacimiento -->
				<div class="form-section">
					<div class="section-label"><i class="fas fa-calendar"></i> Fecha de nacimiento</div>
					<div class="mb-0">
						<input type="text" class="form-control"
							   th:value="${#temporals.format(usuario.fechaNacimiento, 'dd/MM/yyyy')}"
							   disabled>
						<div class="form-text text-muted" style="font-size:0.78rem;">
							Este campo no puede modificarse.
						</div>
					</div>
				</div>

				<!-- Cambiar contraseña -->
				<div class="form-section">
					<div class="section-label"><i class="fas fa-lock"></i> Cambiar contraseña</div>
					<p class="text-muted mb-3" style="font-size:0.82rem; margin-top:-8px;">
						Déjalo en blanco si no deseas cambiar tu contraseña.
					</p>

					<div class="mb-3">
						<label class="form-label">Contraseña actual</label>
						<div class="input-icon-wrap">
							<i class="input-icon fas fa-lock"></i>
							<input type="password" class="form-control" name="passwordActual"
								   placeholder="••••••••">
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label">Nueva contraseña</label>
						<div class="input-icon-wrap">
							<i class="input-icon fas fa-key"></i>
							<input type="password" class="form-control" name="passwordNueva"
								   placeholder="Mínimo 6 caracteres">
						</div>
					</div>

					<div class="mb-0">
						<label class="form-label">Confirmar nueva contraseña</label>
						<div class="input-icon-wrap">
							<i class="input-icon fas fa-key"></i>
							<input type="password" class="form-control" name="passwordConfirmar"
								   placeholder="Repite la nueva contraseña">
						</div>
					</div>
				</div>

				<div class="form-footer">
					<button type="submit" class="btn-guardar">
						<i class="fas fa-floppy-disk me-2"></i>Guardar cambios
					</button>
					<a th:href="@{/inicio}" class="btn-cancelar">
						<i class="fas fa-arrow-left"></i> Volver
					</a>
				</div>

			</form>
		</div>

	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>
	<th:block th:utext="${toast}"></th:block>

</body>
</html>
