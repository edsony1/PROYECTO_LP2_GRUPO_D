<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Tienda Ropa - Usuarios</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
	<link rel="stylesheet" th:href="@{/login.css}">
	<link rel="stylesheet" th:href="@{/admin.css}">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

	<div th:replace="~{fragments/nav :: nav}"></div>

	<div class="container mt-4 mb-5 flex-grow-1">

		<div class="page-header">
			<div class="page-header-left">
				<div class="header-icon">
					<i class="fas fa-users"></i>
				</div>
				<div>
					<h2>Usuarios</h2>
					<p>Gestión de clientes registrados</p>
				</div>
			</div>
		</div>

		<div class="table-card">
			<table class="table" th:if="${!#lists.isEmpty(usuarios)}">
				<thead>
					<tr>
						<th>#</th>
						<th>Nombre</th>
						<th>Correo</th>
						<th>Estado</th>
						<th class="text-end">Acciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="usuario : ${usuarios}">
						<td>
							<span class="text-muted" style="font-size:0.82rem;" th:text="${usuario.idUsuario}"></span>
						</td>
						<td>
							<div class="d-flex align-items-center gap-2">
								<div class="row-avatar">
									<i class="fas fa-user"></i>
								</div>
								<span th:text="${usuario.nombres + ' ' + usuario.apellidos}"></span>
							</div>
						</td>
						<td th:text="${usuario.correo}"></td>
						<td>
							<span th:if="${usuario.estado}" class="badge-activo">Activo</span>
							<span th:unless="${usuario.estado}" class="badge-inactivo">Inactivo</span>
						</td>
						<td class="text-end">
							<div class="d-flex gap-1 justify-content-end">
								<a th:if="${usuario.estado}"
								   th:href="@{'/usuario/desactivar/' + ${usuario.idUsuario}}"
								   class="btn-accion btn-desactivar" title="Desactivar">
									<i class="fas fa-ban"></i>
								</a>
								<a th:unless="${usuario.estado}"
								   th:href="@{'/usuario/activar/' + ${usuario.idUsuario}}"
								   class="btn-accion btn-activar" title="Activar">
									<i class="fas fa-check"></i>
								</a>
							</div>
						</td>
					</tr>
				</tbody>
			</table>

			<div class="empty-state" th:if="${#lists.isEmpty(usuarios)}">
				<i class="fas fa-users"></i>
				<p class="mb-0">No hay usuarios registrados.</p>
			</div>
		</div>

	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>
	<th:block th:utext="${toast}"></th:block>

</body>
</html>
